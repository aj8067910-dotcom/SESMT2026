<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 64">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AADF5A"/>
      <stop offset="50%" stop-color="#5CB81E"/>
      <stop offset="100%" stop-color="#1D6013"/>
    </linearGradient>
    <clipPath id="sc">
      <path d="M28,2 L52,11 L52,40 Q52,56 28,63 Q4,56 4,40 L4,11 Z"/>
    </clipPath>
  </defs>

  <!-- Shield -->
  <path d="M28,2 L52,11 L52,40 Q52,56 28,63 Q4,56 4,40 L4,11 Z" fill="url(#sg)"/>

  <!-- Helmet dome -->
  <path d="M14,37 C14,26 42,26 42,37" fill="white" clip-path="url(#sc)"/>
  <!-- Helmet brim -->
  <rect x="8" y="36" width="40" height="5" rx="2.5" fill="white" clip-path="url(#sc)"/>
  <!-- Helmet ridge -->
  <rect x="23" y="23" width="10" height="6" rx="3" fill="white" clip-path="url(#sc)"/>

  <!-- Checkmark -->
  <path d="M15,50 L24,59 L42,42" stroke="#AADF5A" stroke-width="3.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round" clip-path="url(#sc)"/>
</svg>
