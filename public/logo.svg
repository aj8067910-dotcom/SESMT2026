<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96">
  <defs>
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AADF5A"/>
      <stop offset="50%" stop-color="#5CB81E"/>
      <stop offset="100%" stop-color="#1D6013"/>
    </linearGradient>
    <clipPath id="sc">
      <path d="M50,6 L74,16 L74,58 Q74,78 50,90 Q26,78 26,58 L26,16 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="320" height="96" fill="#0D1117" rx="10"/>

  <!-- Shield body -->
  <path d="M50,6 L74,16 L74,58 Q74,78 50,90 Q26,78 26,58 L26,16 Z" fill="url(#sg)"/>

  <!-- Helmet dome (white arc) -->
  <path d="M36,53 C36,40 64,40 64,53" fill="white" clip-path="url(#sc)"/>
  <!-- Helmet brim -->
  <rect x="28" y="52" width="44" height="6" rx="3" fill="white" clip-path="url(#sc)"/>
  <!-- Helmet top ridge -->
  <rect x="45" y="36" width="10" height="6" rx="3" fill="white" clip-path="url(#sc)"/>

  <!-- Checkmark (lime green) -->
  <path d="M37,70 L46,80 L64,60" stroke="#AADF5A" stroke-width="4" fill="none"
        stroke-linecap="round" stroke-linejoin="round" clip-path="url(#sc)"/>

  <!-- "Safe" white bold -->
  <text x="90" y="57"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="36" font-weight="800" fill="white">Safe</text>

  <!-- "Point" lime-green bold -->
  <text x="168" y="57"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="36" font-weight="800" fill="#7DC528">Point</text>

  <!-- Tagline -->
  <text x="90" y="75"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="8.5" fill="#6A7E8E" letter-spacing="0.8">SEGURANÇA • SAÚDE • CONFORMIDADE</text>
</svg>
