<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 68" fill="none">
  <defs>
    <linearGradient id="shieldGradFull" x1="0" y1="0" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="innerGlowFull" cx="50%" cy="30%" r="55%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shield body (icon portion, top-left anchored, scaled to ~40x54 in 68-tall canvas) -->
  <g transform="translate(8, 7)">
    <!-- Shield fill -->
    <path d="M20 1 Q7 5 3 9 L3 26 C3 39 11 49 20 53 C29 49 37 39 37 26 L37 9 Q33 5 20 1 Z" fill="url(#shieldGradFull)"/>
    <!-- Inner glow -->
    <path d="M20 1 Q7 5 3 9 L3 26 C3 39 11 49 20 53 C29 49 37 39 37 26 L37 9 Q33 5 20 1 Z" fill="url(#innerGlowFull)"/>
    <!-- Location pin teardrop -->
    <path d="M20 35 C20 35 12 26 12 20 C12 15.5 15.6 12 20 12 C24.4 12 28 15.5 28 20 C28 26 20 35 20 35 Z" fill="white" opacity="0.95"/>
    <!-- Outer pin circle -->
    <circle cx="20" cy="20" r="5" fill="white" opacity="0.95"/>
    <!-- Inner blue dot -->
    <circle cx="20" cy="20" r="2.2" fill="#2563eb"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="27" fill="#0f172a" letter-spacing="-0.5">Safe</text>
  <text x="106" y="34" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="27" fill="#0d9488" letter-spacing="-0.5">Point</text>

  <!-- Tagline -->
  <text x="61" y="48" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="3">SST GAMIFICADO</text>
</svg>
